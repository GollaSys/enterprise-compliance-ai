[tool.poetry]
name = "enterprise-compliance-ai"
version = "1.0.0"
description = "AI-powered multi-agent compliance platform"
authors = ["Compliance Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
crewai = "^0.41.1"
langchain = "^0.2.14"
langchain-openai = "^0.1.20"
langchain-anthropic = "^0.1.20"
fastapi = "^0.111.0"
uvicorn = "^0.30.1"
pydantic = "^2.8.2"
sqlalchemy = "^2.0.31"
alembic = "^1.13.2"
asyncpg = "^0.29.0"
chromadb = "^0.5.3"
redis = "^5.0.7"
python-multipart = "^0.0.9"
python-jose = "^3.3.0"
passlib = "^1.7.4"
bcrypt = "^4.1.3"
python-dotenv = "^1.0.1"
httpx = "^0.27.0"
tenacity = "^8.5.0"
structlog = "^24.4.0"
prometheus-client = "^0.20.0"
opentelemetry-api = "^1.25.0"
opentelemetry-sdk = "^1.25.0"
opentelemetry-instrumentation-fastapi = "^0.46b0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-asyncio = "^0.23.8"
pytest-cov = "^5.0.0"
black = "^24.4.2"
isort = "^5.13.2"
flake8 = "^7.1.0"
mypy = "^1.11.1"
pre-commit = "^3.7.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true